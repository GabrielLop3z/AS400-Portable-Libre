name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build update package
        shell: pwsh
        run: |
          $Version = ($env:GITHUB_REF_NAME -replace '^v','')
          & ./build_update_zip.ps1 -Version $Version -OutputDir "$env:RUNNER_TEMP\release"

      - name: Build full portable package (todo incluido)
        shell: pwsh
        run: |
          $Version = ($env:GITHUB_REF_NAME -replace '^v','')
          & ./build_portable_full.ps1 -Version $Version -OutputDir "$env:RUNNER_TEMP\release"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}\release\update_v*.zip
            ${{ runner.temp }}\release\update_v*.zip.sha256
            ${{ runner.temp }}\release\AS400_Portable_Libre_*_TODO_INCLUIDO.zip
            ${{ runner.temp }}\release\AS400_Portable_Libre_*_TODO_INCLUIDO.zip.sha256
